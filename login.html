<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>PHOENIX | Acceso</title>
  <link rel="icon" type="image/jpeg" href="assets/phoenix-logo.jpeg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pedido.css">
  <link rel="stylesheet" href="pedidos.css">
</head>

<body>
  <div class="gold-glow glow-one"></div>
  <div class="gold-glow glow-two"></div>
  <div class="gold-line line-one"></div>
  <div class="gold-line line-two"></div>

  <header class="topbar">
    <div class="brand-mini">PHOENIX</div>
    <a class="login-btn back-btn" href="index.html">← Volver</a>
  </header>

  <main class="order-wrap">
    <section class="order-head">
      <p class="eyebrow">ACCESO ADMINISTRATIVO</p>
      <h1>Iniciar <span>sesión.</span></h1>
      <p class="subtitle">Ingresa con tu cuenta para ver los pedidos.</p>
    </section>

    <form class="order-form login-form" id="loginForm" novalidate>
      <div class="field">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="username" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <span class="error" id="formError"></span>
      <button class="submit-btn" type="submit" id="loginSubmit">Entrar <span>→</span></button>
    </form>
  </main>

  <footer>
    <span></span>
    <p>PHOENIX <b>•</b> THE NEW CONCEPT IN COVERS</p>
    <span></span>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
