<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>PHOENIX | Nuevo pedido</title>
  <link rel="icon" type="image/jpeg" href="assets/phoenix-logo.jpeg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pedido.css">
</head>

<body>
  <div class="gold-glow glow-one"></div>
  <div class="gold-glow glow-two"></div>
  <div class="gold-line line-one"></div>
  <div class="gold-line line-two"></div>

  <header class="topbar">
    <div class="brand-mini">PHOENIX</div>
    <a class="login-btn back-btn" href="index.html">← Volver</a>
  </header>

  <main class="order-wrap">
    <section class="order-head">
      <p class="eyebrow">NUEVO PEDIDO</p>
      <h1>Cuéntanos <span>tu diseño.</span></h1>
      <p class="subtitle">Completa tus datos y describe lo que imaginas para tu carro. Adjunta una imagen de referencia del diseño.</p>
    </section>

    <form class="order-form" id="orderForm" novalidate>
      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Ej: Juan Pérez">
        <span class="error" data-for="nombre"></span>
      </div>

      <div class="field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej: 300 123 4567">
        <span class="error" data-for="telefono"></span>
      </div>

      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
        <span class="error" data-for="correo"></span>
      </div>

      <div class="field">
        <label for="carro">Nombre y modelo del carro</label>
        <input id="carro" name="carro" type="text" placeholder="Ej: Mazda 3 2021">
        <span class="error" data-for="carro"></span>
      </div>

      <div class="field full">
        <label for="descripcion">Descripción del diseño</label>
        <textarea id="descripcion" name="descripcion" rows="5" placeholder="Colores, estilo, textos, logos, dónde lo quieres..."></textarea>
        <span class="error" data-for="descripcion"></span>
      </div>

      <div class="field full">
        <label for="imagen">Imagen del diseño</label>
        <label class="dropzone" id="dropzone" for="imagen">
          <input id="imagen" name="imagen" type="file" accept="image/*" hidden>
          <span class="dz-icon">＋</span>
          <span class="dz-title">Añadir imagen</span>
          <span class="dz-text">Haz clic o arrastra tu archivo aquí (JPG, PNG, WEBP · máx. 8 MB)</span>
        </label>
        <div class="preview" id="preview" hidden>
          <img id="previewImg" alt="Vista previa del diseño">
          <div class="preview-info">
            <span id="previewName"></span>
            <button type="button" id="removeImg">Quitar</button>
          </div>
        </div>
        <span class="error" data-for="imagen"></span>
      </div>

      <button class="submit-btn" type="submit" id="submitBtn">Enviar pedido <span>→</span></button>
    </form>

    <section class="success" id="success" hidden>
      <div class="success-icon">✓</div>
      <h2>¡Pedido recibido!</h2>
      <p class="success-code" id="orderCode"></p>
      <p class="subtitle">Guarda tu número de pedido para consultarlo después.</p>
      <div class="success-actions">
        <button type="button" class="ghost-btn" id="newAgain">Hacer otro pedido</button>
        <a class="ghost-btn solid" href="index.html">Volver al inicio</a>
      </div>
    </section>
  </main>

  <footer>
    <span></span>
    <p>PHOENIX <b>•</b> THE NEW CONCEPT IN COVERS</p>
    <span></span>
  </footer>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="pedido.js"></script>
</body>
</html>
