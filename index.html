<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Phoenix - Gestión de pedidos">
  <title>PHOENIX | Pedidos</title>
  <link rel="icon" type="image/jpeg" href="assets/phoenix-logo.jpeg">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="gold-glow glow-one"></div>
  <div class="gold-glow glow-two"></div>
  <div class="gold-line line-one"></div>
  <div class="gold-line line-two"></div>

  <header class="topbar">
    <div class="brand-mini">PHOENIX</div>

    <button class="login-btn" id="loginBtn" type="button">
      <span class="login-icon">◉</span>
      Login
    </button>
  </header>

  <main class="hero">
    <section class="logo-area">
      <div class="logo-frame">
        <div class="logo-shine"></div>
        <img
          src="assets/phoenix-logo.jpeg"
          alt="Phoenix - The new concept in covers"
          class="phoenix-logo"
        >
      </div>

      <p class="eyebrow">GESTIÓN DE PEDIDOS</p>
      <h1>Tu pedido, <span>al siguiente nivel.</span></h1>
      <p class="subtitle">
        Crea un nuevo pedido o consulta uno existente de forma rápida y sencilla.
      </p>
    </section>

    <section class="actions" aria-label="Opciones principales">
      <button class="action-card" id="newOrderBtn" type="button">
        <span class="card-number">01</span>
        <span class="card-icon">＋</span>
        <span class="card-title">Nuevo pedido</span>
        <span class="card-text">Crear un pedido</span>
        <span class="arrow">→</span>
      </button>

      <button class="action-card" id="viewOrderBtn" type="button">
        <span class="card-number">02</span>
        <span class="card-icon">⌕</span>
        <span class="card-title">Ver pedido</span>
        <span class="card-text">Consultar un pedido</span>
        <span class="arrow">→</span>
      </button>
    </section>
  </main>

  <footer>
    <span></span>
    <p>PHOENIX <b>•</b> THE NEW CONCEPT IN COVERS</p>
    <span></span>
  </footer>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
