<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>PHOENIX | Pedidos</title>
  <link rel="icon" type="image/jpeg" href="assets/phoenix-logo.jpeg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pedido.css">
  <link rel="stylesheet" href="pedidos.css">
</head>

<body>
  <div class="gold-glow glow-one"></div>
  <div class="gold-glow glow-two"></div>
  <div class="gold-line line-one"></div>
  <div class="gold-line line-two"></div>

  <header class="topbar">
    <div class="brand-mini">PHOENIX</div>
    <div class="bar-actions">
      <a class="login-btn back-btn" href="index.html">← Inicio</a>
      <button class="login-btn" id="logoutBtn" type="button">Salir</button>
    </div>
  </header>

  <main class="order-wrap wide">
    <section class="order-head">
      <p class="eyebrow">PANEL</p>
      <h1>Tus <span>pedidos.</span></h1>
      <p class="subtitle" id="count">Cargando pedidos...</p>
    </section>

    <div class="list-tools">
      <input class="search" id="search" type="search" placeholder="Buscar por nombre, código, carro, teléfono...">
    </div>

    <section class="orders" id="orders"></section>
  </main>

  <footer>
    <span></span>
    <p>PHOENIX <b>•</b> THE NEW CONCEPT IN COVERS</p>
    <span></span>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="pedidos.js"></script>
</body>
</html>
